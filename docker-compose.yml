# Local infrastructure. `docker compose up -d` then follow README.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conversaforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  # Valkey is a BSD-licensed, Redis-protocol-compatible server.
  redis:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
